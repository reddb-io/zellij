name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false

permissions:
  contents: write

jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
      matrix_build-release-normal: ${{ steps.select.outputs.matrix_build-release-normal }}
      enabled_build-release-normal: ${{ steps.select.outputs.enabled_build-release-normal }}
      matrix_build-release-noweb: ${{ steps.select.outputs.matrix_build-release-noweb }}
      enabled_build-release-noweb: ${{ steps.select.outputs.enabled_build-release-noweb }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_arm64", "linux_x64", "macos_arm64", "macos_x64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {
              "build-release-normal": [
                {
                  "flag": "linux_x64",
                  "row": {
                    "build": "linux musl x64",
                    "os": "ubuntu-latest",
                    "target": "x86_64-unknown-linux-musl"
                  }
                },
                {
                  "flag": "linux_arm64",
                  "row": {
                    "build": "linux musl aarch64",
                    "os": "ubuntu-latest",
                    "target": "aarch64-unknown-linux-musl"
                  }
                },
                {
                  "flag": "macos_x64",
                  "row": {
                    "build": "macos x64",
                    "os": "macos-latest",
                    "target": "x86_64-apple-darwin"
                  }
                },
                {
                  "flag": "macos_arm64",
                  "row": {
                    "build": "macos aarch64",
                    "os": "macos-latest",
                    "target": "aarch64-apple-darwin"
                  }
                },
                {
                  "flag": "windows_x64",
                  "row": {
                    "build": "windows x64",
                    "os": "windows-latest",
                    "target": "x86_64-pc-windows-msvc"
                  }
                }
              ],
              "build-release-noweb": [
                {
                  "flag": "linux_x64",
                  "row": {
                    "build": "linux musl x64",
                    "os": "ubuntu-latest",
                    "target": "x86_64-unknown-linux-musl"
                  }
                },
                {
                  "flag": "linux_arm64",
                  "row": {
                    "build": "linux musl aarch64",
                    "os": "ubuntu-latest",
                    "target": "aarch64-unknown-linux-musl"
                  }
                },
                {
                  "flag": "macos_x64",
                  "row": {
                    "build": "macos x64",
                    "os": "macos-latest",
                    "target": "x86_64-apple-darwin"
                  }
                },
                {
                  "flag": "macos_arm64",
                  "row": {
                    "build": "macos aarch64",
                    "os": "macos-latest",
                    "target": "aarch64-apple-darwin"
                  }
                },
                {
                  "flag": "windows_x64",
                  "row": {
                    "build": "windows x64",
                    "os": "windows-latest",
                    "target": "x86_64-pc-windows-msvc"
                  }
                }
              ]
            }
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: create_release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && '' || github.ref }}
          release_name: Release ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.any == 'true') }}
  build-release-normal:
    needs:
      - create-release
      - platforms
    name: build-release-normal
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix_build-release-normal) }}
    steps:
      - name: Set release tag (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]; then
            echo "RELEASE_TAG=main" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_ENV"
          fi

      - name: Set release tag (Windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            echo "RELEASE_TAG=main" >> $env:GITHUB_ENV
          } else {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          }

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build release binary (cross-compiled)
        if: matrix.build != 'windows x64'
        run: cargo xtask ci cross ${{ matrix.target }}

      - name: Build release binary (Windows native)
        if: matrix.build == 'windows x64'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        id: make-artifact-unix
        run: |
          asset_name="zellij-${{ matrix.target }}.tar.gz"
          tar cvzf "${asset_name}" -C "target/${{ matrix.target }}/release" zellij
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        id: make-artifact-windows
        run: |
          $asset_name = "zellij-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/release/zellij.exe" -DestinationPath $asset_name
          echo "asset_name=$asset_name" >> $env:GITHUB_OUTPUT

      - name: Create checksum (Unix)
        if: runner.os != 'Windows'
        id: make-checksum-unix
        run: |
          checksum_name="zellij-${{ matrix.target }}.sha256sum"
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            sha256sum "target/${{ matrix.target }}/release/zellij" > "${checksum_name}"
          else
            shasum -a 256 "target/${{ matrix.target }}/release/zellij" > "${checksum_name}"
          fi
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"

      - name: Create checksum (Windows)
        if: runner.os == 'Windows'
        id: make-checksum-windows
        run: |
          $checksum_name = "zellij-${{ matrix.target }}.sha256sum"
          $hash = (Get-FileHash "target/release/zellij.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  target/release/zellij.exe" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}
          asset_name: ${{ runner.os == 'Windows' && format('zellij-{0}.zip', matrix.target) || format('zellij-{0}.tar.gz', matrix.target) }}
          asset_content_type: application/octet-stream

      - name: Upload checksum
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-checksum-unix.outputs.checksum_name || steps.make-checksum-windows.outputs.checksum_name }}
          asset_name: zellij-${{matrix.target}}.sha256sum
          asset_content_type: text/plain

      # ===== Windows MSI installer =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: |
          # MSI ProductVersion must be numeric x.y.z — strip any semver
          # build metadata (the fork versions as e.g. 0.46.0+red.1).
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\Zellij.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\zellij-x86_64-pc-windows-msvc-installer.msi

      - name: Create MSI checksum
        if: runner.os == 'Windows'
        id: make-checksum-msi
        run: |
          $checksum_name = "zellij-${{ matrix.target }}-installer.sha256sum"
          $hash = (Get-FileHash "target\wix\zellij-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  zellij-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload MSI installer
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target\wix\zellij-${{ matrix.target }}-installer.msi
          asset_name: zellij-${{ matrix.target }}-installer.msi
          asset_content_type: application/octet-stream

      - name: Upload MSI checksum
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-checksum-msi.outputs.checksum_name }}
          asset_name: zellij-${{ matrix.target }}-installer.sha256sum
          asset_content_type: text/plain

    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.enabled_build-release-normal == 'true') }}
  build-release-noweb:
    needs:
      - create-release
      - platforms
    name: build-release-noweb
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix_build-release-noweb) }}
    steps:
      - name: Set release tag (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]; then
            echo "RELEASE_TAG=main" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_ENV"
          fi

      - name: Set release tag (Windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            echo "RELEASE_TAG=main" >> $env:GITHUB_ENV
          } else {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          }

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build release binary (cross-compiled, no-web)
        if: matrix.build != 'windows x64'
        run: cargo xtask ci cross ${{ matrix.target }} --no-web

      - name: Build release binary (Windows native, no-web)
        if: matrix.build == 'windows x64'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release --no-web

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        id: make-artifact-unix
        run: |
          asset_name="zellij-no-web-${{ matrix.target }}.tar.gz"
          tar cvzf "${asset_name}" -C "target/${{ matrix.target }}/release" zellij
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        id: make-artifact-windows
        run: |
          $asset_name = "zellij-no-web-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/release/zellij.exe" -DestinationPath $asset_name
          echo "asset_name=$asset_name" >> $env:GITHUB_OUTPUT

      - name: Create checksum (Unix)
        if: runner.os != 'Windows'
        id: make-checksum-unix
        run: |
          checksum_name="zellij-no-web-${{ matrix.target }}.sha256sum"
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            sha256sum "target/${{ matrix.target }}/release/zellij" > "${checksum_name}"
          else
            shasum -a 256 "target/${{ matrix.target }}/release/zellij" > "${checksum_name}"
          fi
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"

      - name: Create checksum (Windows)
        if: runner.os == 'Windows'
        id: make-checksum-windows
        run: |
          $checksum_name = "zellij-no-web-${{ matrix.target }}.sha256sum"
          $hash = (Get-FileHash "target/release/zellij.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  target/release/zellij.exe" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}
          asset_name: ${{ runner.os == 'Windows' && format('zellij-no-web-{0}.zip', matrix.target) || format('zellij-no-web-{0}.tar.gz', matrix.target) }}
          asset_content_type: application/octet-stream

      - name: Upload checksum
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-checksum-unix.outputs.checksum_name || steps.make-checksum-windows.outputs.checksum_name }}
          asset_name: zellij-no-web-${{matrix.target}}.sha256sum
          asset_content_type: text/plain

      # ===== Windows MSI installer (no-web) =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer (no-web)
        if: runner.os == 'Windows'
        run: |
          # Same build-metadata strip as the normal MSI job above.
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\Zellij.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\zellij-no-web-${{ matrix.target }}-installer.msi

      - name: Create MSI checksum (no-web)
        if: runner.os == 'Windows'
        id: make-checksum-msi
        run: |
          $checksum_name = "zellij-no-web-${{ matrix.target }}-installer.sha256sum"
          $hash = (Get-FileHash "target\wix\zellij-no-web-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  zellij-no-web-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload MSI installer (no-web)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target\wix\zellij-no-web-${{ matrix.target }}-installer.msi
          asset_name: zellij-no-web-${{ matrix.target }}-installer.msi
          asset_content_type: application/octet-stream

      - name: Upload MSI checksum (no-web)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.make-checksum-msi.outputs.checksum_name }}
          asset_name: zellij-no-web-${{ matrix.target }}-installer.sha256sum
          asset_content_type: text/plain

    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.enabled_build-release-noweb == 'true') }}
env:
  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
